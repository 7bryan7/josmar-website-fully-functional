name = "josmar-backend"
main = "src/index.js"
compatibility_date = "2024-03-01"

# ── Cloudflare Worker Secrets (NOT stored here) ──────────────────────────────
# JWT_SECRET must be provisioned as an encrypted Cloudflare Worker Secret:
#
#   wrangler secret put JWT_SECRET
#
# Run that command once per environment (production, staging, etc.).
# Never place the actual secret value in this file — it is committed to Git.
# ─────────────────────────────────────────────────────────────────────────────

[[d1_databases]]
binding = "DB"
database_name = "josmar-db"
database_id = "local-db-id"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "josmar-media"
preview_bucket_name = "josmar-media-preview"
